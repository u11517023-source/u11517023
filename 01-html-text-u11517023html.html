<h1 style="margin: 0.0px 0.0px 16.1px 0.0px; font: 24.0px 'Songti TC'; color: #000000; -webkit-text-stroke: #000000"><span class="s1"><b>林綺洛的學習小站</b></span></h1>
<p class="p2"><span class="s1">你好，我是林綺洛。我喜歡跳舞，也喜歡探索新工具。</span></p>
<h2 style="margin: 0.0px 0.0px 14.9px 0.0px; font: 18.0px 'Songti TC'; color: #000000; -webkit-text-stroke: #000000"><span class="s1"><b>我的學習興趣</b></span></h2>
<p class="p2"><span class="s1">我想用 <b>數位設計</b>，把學習變得更有趣。</span></p>
<h3 style="margin: 0.0px 0.0px 14.0px 0.0px; font: 14.0px 'Songti TC'; color: #000000; -webkit-text-stroke: #000000"><span class="s1">這學期想試試看</span></h3>
<p class="p2"><span class="s1">我的第一個挑戰是：做一個介紹家鄉的網站。</span></p>
<p class="p5"><span class="s1">我的下一個目標</span></p>
<p class="p2"><span class="s1">我還想學會製作 <b>互動故事</b></span></p>
<h2 style="margin: 0.0px 0.0px 14.9px 0.0px; font: 18.0px 'Songti TC'; color: #000000; -webkit-text-stroke: #000000"><span class="s1"><b>我的知識小角落</b></span></h2>
<p class="p2"><span class="s1">水的化學式是 H</span><span class="s2"><sub>2</sub></span><span class="s1">O。</span></p>
<p class="p2"><span class="s1">邊長 3 公分的正方形，面積是 9 cm</span><span class="s2"><sup>2</sup></span><span class="s1">。</span></p>
