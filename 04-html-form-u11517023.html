<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>放學後社團體驗表</title>
</head>

<body>

    <h1>放學後社團體驗表</h1>

    <p>
        這是一份練習用的活動報名表，資料不會送出或保存，不能當成正式報名。
    </p>

    <form>

        <!-- 創作名字 -->
        <p>
            <label for="nickname">你想使用的創作名字</label><br>

            <input
                id="nickname"
                name="nickname"
                type="text"
                placeholder="例如：小海豚">
        </p>


        <!-- 社團選擇 -->
        <p>
            <label for="club">請選擇社團</label><br>

            <select id="club" name="club">

                <option value="">請選擇社團</option>

                <option value="drama">
                    故事劇場
                </option>

                <option value="science">
                    科學手作
                </option>

                <option value="boardgame">
                    桌遊挑戰
                </option>

            </select>
        </p>


        <!-- 日期：只能選一個 -->
        <fieldset>

            <legend>方便參加的日期</legend>

            <p>
                <label>
                    <input
                        type="radio"
                        name="date"
                        value="tuesday">
                    星期二
                </label>
            </p>

            <p>
                <label>
                    <input
                        type="radio"
                        name="date"
                        value="thursday">
                    星期四
                </label>
            </p>

            <p>
                <label>
                    <input
                        type="radio"
                        name="date"
                        value="friday">
                    星期五
                </label>
            </p>

        </fieldset>


        <!-- 活動方式：可以複選 -->
        <fieldset>

            <legend>我期待的活動方式</legend>

            <p>
                <label>
                    <input
                        type="checkbox"
                        name="activity"
                        value="handmade">
                    動手製作
                </label>
            </p>

            <p>
                <label>
                    <input
                        type="checkbox"
                        name="activity"
                        value="teamwork">
                    和同學合作
                </label>
            </p>

            <p>
                <label>
                    <input
                        type="checkbox"
                        name="activity"
                        value="presentation">
                    上台分享
                </label>
            </p>

        </fieldset>


        <!-- 自己新增的欄位 -->
        <p>
            <label for="experience">你最想嘗試的活動經驗</label><br>

            <select id="experience" name="experience">

                <option value="">請選擇</option>

                <option value="new">
                    第一次嘗試
                </option>

                <option value="practice">
                    想增加練習經驗
                </option>

                <option value="challenge">
                    想挑戰新的活動
                </option>

            </select>
        </p>

        <p>
            我新增「你最想嘗試的活動經驗」這個下拉選單，
            因為可以讓參加者先表達自己對活動的期待，
            也能讓活動設計者了解大家想參加的方向。
        </p>


        <!-- 留言 -->
        <p>
            <label for="message">想告訴老師的事</label><br>

            <textarea
                id="message"
                name="message"
                rows="5"
                cols="32"
                placeholder="例如：我想和同學一起完成一個小作品"></textarea>
        </p>


        <!-- 按鈕 -->
        <p>
            <button
                type="button"
                disabled>
                練習版，尚未開放報名
            </button>
        </p>

    </form>

</body>

</html>
